<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff7fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d2733" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#40556f"/>
    </marker>
    <style>
      .title { font: 700 30px "DejaVu Sans", Arial, sans-serif; fill: #182433; }
      .stage { font: 700 21px "DejaVu Sans", Arial, sans-serif; fill: #172235; }
      .body { font: 15px "DejaVu Sans", Arial, sans-serif; fill: #4c5c6f; }
      .note { font: 13px "DejaVu Sans", Arial, sans-serif; fill: #68788d; }
      .box { filter: url(#shadow); stroke-width: 1.5; }
      .arrow { stroke: #40556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .tag { font: 700 13px "DejaVu Sans", Arial, sans-serif; fill: white; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="430" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="title">UBC-OCEAN WSI Classification Pipeline</text>
  <text x="48" y="86" class="note">From ultra-large pathology images to tile-level evidence and WSI-level subtype prediction</text>

  <g transform="translate(50,130)">
    <rect class="box" x="0" y="0" width="175" height="185" rx="18" fill="#ffffff" stroke="#d6e3f2"/>
    <rect x="18" y="20" width="52" height="26" rx="13" fill="#4f8bd6"/>
    <text x="30" y="38" class="tag">01</text>
    <text x="18" y="74" class="stage">WSI 输入</text>
    <text x="18" y="105" class="body">超大病理切片图</text>
    <text x="18" y="130" class="body">无法直接整图训练</text>
    <text x="18" y="155" class="note">PNG / thumbnail / WSI</text>
  </g>

  <path class="arrow" d="M235,222 C260,222 270,222 292,222"/>

  <g transform="translate(305,130)">
    <rect class="box" x="0" y="0" width="175" height="185" rx="18" fill="#ffffff" stroke="#d6e3f2"/>
    <rect x="18" y="20" width="52" height="26" rx="13" fill="#15a6a6"/>
    <text x="30" y="38" class="tag">02</text>
    <text x="18" y="74" class="stage">切 Tile</text>
    <text x="18" y="105" class="body">2048 裁剪</text>
    <text x="18" y="130" class="body">缩放到 1024</text>
    <text x="18" y="155" class="note">过滤背景 tile</text>
  </g>

  <path class="arrow" d="M490,222 C515,222 525,222 547,222"/>

  <g transform="translate(560,130)">
    <rect class="box" x="0" y="0" width="175" height="185" rx="18" fill="#ffffff" stroke="#d6e3f2"/>
    <rect x="18" y="20" width="52" height="26" rx="13" fill="#c47bd7"/>
    <text x="30" y="38" class="tag">03</text>
    <text x="18" y="74" class="stage">染色增强</text>
    <text x="18" y="105" class="body">StainNet 标准化</text>
    <text x="18" y="130" class="body">stainmix 训练</text>
    <text x="18" y="155" class="note">降低域偏移</text>
  </g>

  <path class="arrow" d="M745,222 C770,222 780,222 802,222"/>

  <g transform="translate(815,130)">
    <rect class="box" x="0" y="0" width="175" height="185" rx="18" fill="#ffffff" stroke="#d6e3f2"/>
    <rect x="18" y="20" width="52" height="26" rx="13" fill="#e79645"/>
    <text x="30" y="38" class="tag">04</text>
    <text x="18" y="74" class="stage">分类模型</text>
    <text x="18" y="105" class="body">EfficientNet /</text>
    <text x="18" y="130" class="body">ResNeSt / SE-ResNeXt</text>
    <text x="18" y="155" class="note">tile softmax 概率</text>
  </g>

  <path class="arrow" d="M1000,222 C1025,222 1035,222 1057,222"/>

  <g transform="translate(1070,130)">
    <rect class="box" x="-20" y="0" width="120" height="185" rx="18" fill="#ffffff" stroke="#d6e3f2"/>
    <rect x="0" y="20" width="52" height="26" rx="13" fill="#5eb872"/>
    <text x="12" y="38" class="tag">05</text>
    <text x="0" y="74" class="stage">聚合</text>
    <text x="0" y="105" class="body">WSI 级</text>
    <text x="0" y="130" class="body">概率融合</text>
    <text x="0" y="155" class="note">最终亚型</text>
  </g>

  <g transform="translate(52,350)">
    <rect x="0" y="0" width="1076" height="44" rx="14" fill="#172235" opacity="0.92"/>
    <text x="26" y="28" class="body" fill="#ffffff" style="fill:#ffffff">Demo path: 全量 mini tile 训练一个 EfficientNetV2-L 中间模型，并用 WSI 缩略热力图解释 tile 证据与最终预测。</text>
  </g>
</svg>
